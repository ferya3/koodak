# ── KidsWorld · Nginx ──
# kidsworld.local      → Next.js (سایت عمومی، محیط کودک، پنل والدین)
# api.kidsworld.local  → Laravel (API v1، پنل مدیریت /admin، فایل‌ها)

upstream web { server web:3000; }

server {
    listen 80;
    server_name kidsworld.local;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /_next/static/ {
        proxy_pass http://web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.kidsworld.local;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location ~* \.(css|js|svg|woff2?|png|jpe?g|webp|avif)$ {
        try_files $uri /index.php?$query_string;
        expires 30d;
    }

    location ~ /\.(?!well-known) { deny all; }
}
